; Firmware do coordenador — horta-iot-espnow
; Referência: https://docs.platformio.org/en/latest/projectconf/index.html

[platformio]
; `pio run` sem -e compila só a placa; o ambiente native serve apenas aos testes.
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
; Mesma plataforma do no_sensor/ (manter as duas iguais):
; pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino

; Porta da placa COORD (serial do CH9102: 5AC9002039), nome estável criado pelo udev
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9002039-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9002039-if00
monitor_speed = 115200
; Eco local no monitor, para ver o que se digita nos comandos do console.
; https://docs.platformio.org/en/latest/projectconf/sections/env/options/monitor/monitor_echo.html
monitor_echo = yes

; Pacote compartilhado (comum/protocolo), método recomendado pelo PlatformIO para bibliotecas locais
lib_deps = protocolo=symlink://../comum/protocolo

; Testes unitários no PC: cd coordenador && pio test -e native
; https://docs.platformio.org/en/latest/platforms/native.html (usa o GCC do sistema)
; Por padrão test_build_src = no: o src/ (Arduino) não é compilado nos testes;
; só as bibliotecas C++ puras de lib/ (calendario) e comum/.
[env:native]
platform = native
test_framework = unity
lib_deps = protocolo=symlink://../comum/protocolo
build_flags = -std=gnu++17 -Wall -Wextra
