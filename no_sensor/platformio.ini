; Firmware do nó sensor — horta-iot-espnow
; Referência: https://docs.platformio.org/en/latest/projectconf/index.html

[platformio]
; `pio run` sem -e compila só a placa; o ambiente native serve apenas aos testes.
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
; pioarduino fixado numa release exata: Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5
; https://github.com/pioarduino/platform-espressif32/releases/tag/55.03.312-1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino

; Porta da placa NÓ 1 (serial do CH9102: 5AC9001351), nome estável criado pelo udev
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9001351-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9001351-if00
monitor_speed = 115200

; Pacote compartilhado (comum/protocolo), método recomendado pelo PlatformIO para bibliotecas locais
lib_deps = protocolo=symlink://../comum/protocolo

; Etapa 5, otimização 4: flash em QIO (4 linhas de dados) em vez de DIO (padrão da placa).
; https://docs.platformio.org/en/latest/platforms/espressif32.html
board_build.flash_mode = qio
; O build usa bootloader_qio e as bibliotecas da variante qio_qspi; o cabeçalho
; da imagem fica em DIO para a ROM carregar o bootloader no modo mais compatível.
board_build.f_flash = 80000000L

; Etapa 7: tabela oficial do Arduino-ESP32 com um único app de 3968 KB (sem OTA
; e sem sistema de arquivos, que o nó não usa). A nvs fica no mesmo endereço do
; default.csv: o contador de boots é preservado. Justificativa em docs/persistencia.md.
; https://docs.platformio.org/en/latest/platforms/espressif32.html (Partition Tables)
board_build.partitions = max_app_4MB.csv
; O builder do pioarduino só limita o tamanho do firmware pela partição ota_0;
; a app0 desta tabela é factory, então é preciso indicá-la para o limite valer.
; (platforms/espressif32/builder/main.py, _update_max_upload_size)
board_build.app_partition_name = app0

; Bancada (Etapa 5): mesmo firmware instrumentado, com período de 10 s em vez
; de 15 min, para obter muitos ciclos rápido. Os envs teste_* herdam este valor.
[bancada]
build_flags = -D PERIODO_BANCADA_MS=10000

[env:bancada]
extends = env:esp32doit-devkit-v1
build_flags = ${bancada.build_flags}

; Build de produção (Etapa 5): sem logs na serial. O tempo acordado aparece no
; coordenador (acordado_ant_ms). Gravar com: pio run -e producao -t upload
[env:producao]
extends = env:esp32doit-devkit-v1
build_flags = -D PRODUCAO

; Modos de teste de bancada da Etapa 4 (docs/comunicacao.md). Gravar com
;   pio run -e <env> -t upload   e voltar ao normal com   pio run -t upload
[env:teste_duplicata]
extends = env:esp32doit-devkit-v1
build_flags = ${bancada.build_flags} -D TESTE_DUPLICATA=5

; Canal 6: sem sobreposição com o 1 do coordenador
[env:teste_canal6]
extends = env:esp32doit-devkit-v1
build_flags = ${bancada.build_flags} -D TESTE_CANAL_WIFI=6

; Canal 2: adjacente ao 1 (espectros de 22 MHz se sobrepõem)
[env:teste_canal2]
extends = env:esp32doit-devkit-v1
build_flags = ${bancada.build_flags} -D TESTE_CANAL_WIFI=2

; Etapa 5: perfil de tempo do hardware com chaveamento, antes de ele existir.
; O LED azul (GPIO2) faz o papel do MOSFET: acende com os sensores "ligados" e
; mostra se o nível se mantém no light sleep. Só para teste (GPIO2 é strapping).
[env:teste_chaveamento]
extends = env:esp32doit-devkit-v1
build_flags = ${bancada.build_flags} -D TESTE_PINO_ALIM_SENSORES=2

; Etapa 5, proteções: rampa de tensão simulada (3700 → 3100 → 3700 mV) para
; exercitar os modos normal/economia/crítico com histerese
[env:teste_tensao]
extends = env:esp32doit-devkit-v1
build_flags = ${bancada.build_flags} -D TESTE_RAMPA_ALIM

; Etapa 5, proteções: o ciclo trava num laço a cada 4 pacotes (o prazo deve dormir o nó)
[env:teste_trava]
extends = env:esp32doit-devkit-v1
build_flags = ${bancada.build_flags} -D TESTE_TRAVAR_A_CADA=4

; Testes unitários do protocolo no PC: pio test -e native
; https://docs.platformio.org/en/latest/platforms/native.html (usa o GCC do sistema)
; Por padrão test_build_src = no: o src/ (Arduino) não é compilado nos testes.
[env:native]
platform = native
test_framework = unity
lib_deps = protocolo=symlink://../comum/protocolo
build_flags = -std=gnu++17 -Wall -Wextra
