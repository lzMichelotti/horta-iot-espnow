; Firmware do nó sensor — horta-iot-espnow
; Referência: https://docs.platformio.org/en/latest/projectconf/index.html

[env:esp32doit-devkit-v1]
; pioarduino fixado numa release exata: Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5
; https://github.com/pioarduino/platform-espressif32/releases/tag/55.03.312-1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino

; Porta da placa NÓ 1 (serial do CH9102: 5AC9001351), nome estável criado pelo udev
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9001351-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9001351-if00
monitor_speed = 115200
