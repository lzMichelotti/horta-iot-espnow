; Ponte HTTP (Etapa 9): uma placa entra no Wi-Fi do coordenador e faz, pela
; serial, as requisições que o app faria. Serve para testar a API pelo PC, que
; não tem Wi-Fi. Grava por cima do firmware do nó: depois, regravar no_sensor
; com "pio run -e bancada -t upload".
; SSID e senha vêm do segredos.h do coordenador (fora do Git), pelo -I abaixo.
[env:ponte]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
build_flags = -I ../../coordenador/src
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9009194-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9009194-if00
monitor_speed = 115200
