; Diagnóstico do barramento I²C do NÓ 1 (AHT20 sem resposta, 21/10/2026).
; Grava por cima do firmware do nó: depois, regravar no_sensor com "pio run -e bancada -t upload".
[env:scanner]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9001351-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9001351-if00
monitor_speed = 115200
