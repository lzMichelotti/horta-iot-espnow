; Experimentos de rádio para a revisão do artigo da ERRC (out/2026):
; ESP-NOW × BLE no nó, criptografia do ESP-NOW e coexistência Wi-Fi/BLE no
; coordenador. Não substitui os firmwares de produção (no_sensor/, coordenador/).
; Mesma plataforma e mesmas tabelas de partições da produção: a NVS (contador
; de boots) e o LittleFS da COORD não são tocados.
; Referência: https://docs.platformio.org/en/latest/projectconf/index.html

[platformio]
default_envs = no_espnow

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; ---------------------------------------------------------------- NÓ 1
[no]
extends = base
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9001351-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9001351-if00
board_build.partitions = max_app_4MB.csv
board_build.app_partition_name = app0
build_src_filter = +<no.cpp>

[env:no_espnow]
extends = no
build_flags = -D MODO_ESPNOW

; PMK + LMK corretas (CCMP)
[env:no_espnow_cripto]
extends = no
build_flags = -D MODO_ESPNOW -D CRIPTO=1

; LMK errada: simula um intruso que conhece o MAC do nó, mas não a chave
[env:no_espnow_chave_errada]
extends = no
build_flags = -D MODO_ESPNOW -D CRIPTO=2

; BLE só pelo controlador (VHCI), como o exemplo oficial controller_vhci_ble_adv
[env:no_ble_vhci]
extends = no
build_src_filter = +<no.cpp> +<hci.cpp>
build_flags = -D MODO_BLE_VHCI -D ANUNCIO_MS=100

; Idem, anunciando só ~30 ms (1–2 eventos de anúncio)
[env:no_ble_vhci_30ms]
extends = no
build_src_filter = +<no.cpp> +<hci.cpp>
build_flags = -D MODO_BLE_VHCI -D ANUNCIO_MS=30

; BLE pela biblioteca BLE do núcleo Arduino (pilha Bluedroid completa)
[env:no_ble_arduino]
extends = no
build_flags = -D MODO_BLE_ARDUINO -D ANUNCIO_MS=100

; ---------------------------------------------------------------- COORD
[coord]
extends = base
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9002039-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5AC9002039-if00
board_build.partitions = ../../coordenador/particoes.csv
board_build.app_partition_name = app0
build_src_filter = +<coord.cpp>

[env:coord_espnow]
extends = coord

; NÓ 1 cadastrado como peer cifrado (PMK + LMK)
[env:coord_cripto]
extends = coord
build_flags = -D CRIPTO=1

; SoftAP + recepção ESP-NOW + varredura BLE contínua (coexistência)
[env:coord_coex]
extends = coord
build_src_filter = +<coord.cpp> +<hci.cpp>
build_flags = -D BLE_SCAN
